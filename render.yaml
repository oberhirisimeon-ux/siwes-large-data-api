services:
  - type: web
    name: siwes-large-data-api
    runtime: python
    rootDir: large-data-backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app:app --host 0.0.0.0 --port $PORT
    plan: starter
    disk:
      name: dataset-disk
      mountPath: /var/data
      sizeGB: 25
    envVars:
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
